<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>放射線科専門医 分野別スマホクイズ</title>
<style>
:root {
  --blue:#2563eb; --blue2:#1d4ed8; --pale:#eff6ff; --ink:#111827;
  --muted:#6b7280; --line:#d1d5db; --ok:#15803d; --ng:#dc2626; --warn:#92400e;
  --card:#ffffff; --bg:#f8fafc;
}
*{box-sizing:border-box}
body{
  margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  background:var(--bg); color:var(--ink); -webkit-tap-highlight-color:transparent;
}
.app{max-width:620px;margin:0 auto;min-height:100dvh;padding-bottom:92px}
header{
  position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:#fff;padding:14px 16px 12px;box-shadow:0 2px 12px rgba(0,0,0,.12)
}
header h1{font-size:18px;margin:0 0 4px}
header .sub{font-size:12px;opacity:.9}
.panel{margin:14px;background:var(--card);border:1px solid #e5e7eb;border-radius:16px;padding:14px;box-shadow:0 4px 14px rgba(15,23,42,.05)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.controls label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}
select,button{
  width:100%;font:inherit;border-radius:12px;border:1px solid var(--line);background:#fff;padding:12px;
}
button{font-weight:700;cursor:pointer}
button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
button.secondary{background:var(--pale);color:var(--blue2);border-color:#bfdbfe}
button.danger{color:var(--ng);border-color:#fecaca;background:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:9px}
.row>*{flex:1}
.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;margin-bottom:10px}
.progress{height:7px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-bottom:14px}
.progress>div{height:100%;background:var(--blue);width:0}
.qtext{font-size:18px;line-height:1.55;font-weight:700;margin:8px 0 16px}
.qimage{width:100%;max-height:310px;object-fit:contain;border:1px solid #e5e7eb;border-radius:12px;background:#fff;margin:0 0 14px}
.choice{
  display:flex;align-items:flex-start;gap:11px;padding:13px 12px;margin:9px 0;
  border:1px solid var(--line);border-radius:13px;background:#fff;cursor:pointer;line-height:1.45
}
.choice input{margin-top:3px;transform:scale(1.25)}
.choice.selected{border-color:#60a5fa;background:#eff6ff}
.choice.correct{border-color:#86efac;background:#f0fdf4}
.choice.wrong{border-color:#fca5a5;background:#fef2f2}
.result{margin-top:14px;padding:13px;border-radius:13px;font-weight:700;display:none}
.result.ok{display:block;background:#dcfce7;color:#166534}
.result.ng{display:block;background:#fee2e2;color:#991b1b}
.result.warn{display:block;background:#fef3c7;color:#92400e}
.note{font-size:12px;color:var(--warn);margin-top:8px;line-height:1.45}

.explanation{
  display:none;margin-top:12px;padding:13px 14px;border-radius:13px;
  background:#f8fafc;border:1px solid #cbd5e1;line-height:1.65;
  font-size:13px;white-space:pre-line
}
.explanation.show{display:block}
.explanation-title{font-weight:800;color:#1d4ed8;margin-bottom:6px;font-size:14px}

.missline{display:flex;align-items:center;gap:8px;margin-top:13px;font-size:14px}
.missline input{transform:scale(1.25)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{text-align:center;background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:10px 6px}
.stat b{display:block;font-size:20px;color:var(--blue2)} .stat span{font-size:11px;color:var(--muted)}
.hidden{display:none!important}

.search-wrap{margin-top:12px}
.search-row{display:grid;grid-template-columns:1fr auto;gap:8px}
.search-row input{
  width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  font-size:16px;background:#fff;color:inherit;outline:none
}
.search-row input:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.18)}
.search-clear{padding:10px 14px;white-space:nowrap}
.search-help{margin-top:6px;font-size:11px;color:var(--muted);line-height:1.45}

.bottom{
  position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);border-top:1px solid #e5e7eb;padding:10px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))
}
.bottom .inner{max-width:620px;margin:0 auto;display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px}
.small{font-size:12px;color:var(--muted);line-height:1.5}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px}
hr{border:0;border-top:1px solid #e5e7eb;margin:14px 0}
@media (max-width:420px){
  .controls{grid-template-columns:1fr}
  .qtext{font-size:17px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>放射線科専門医 分野別スマホクイズ</h1>
  <div class="sub">タップで選択・自動採点・ミス問題だけ復習</div>
</header>

<section class="panel">
  <div class="controls">
    <div>
      <label for="category">分野</label>
      <select id="category"></select>
    </div>
    <div>
      <label for="mode">出題モード</label>
      <select id="mode">
        <option value="all">全問題</option>
        <option value="wrong">ミス問題のみ</option>
        <option value="unanswered">未回答のみ</option>
      </select>
    </div>
  </div>

  <div class="search-wrap">
    <label for="keyword">キーワード検索</label>
    <div class="search-row">
      <input id="keyword" type="search" placeholder="例：膵癌、DWI、2021、MIBG" autocomplete="off">
      <button id="clearSearchBtn" type="button" class="secondary search-clear">クリア</button>
    </div>
    <div class="search-help">問題文・選択肢・解説・年度・分野から検索します。複数語はすべて含む問題を抽出します。</div>
  </div>
  <div class="row" style="margin-top:10px">
    <button id="startBtn" class="primary">この条件で開始</button>
    <button id="shuffleBtn" class="secondary">順番をシャッフル</button>
  </div>
  <div class="stats">
    <div class="stat"><b id="totalStat">0</b><span>対象問題</span></div>
    <div class="stat"><b id="correctStat">0</b><span>正解</span></div>
    <div class="stat"><b id="missStat">0</b><span>ミス登録</span></div>
  </div>
</section>

<section id="quizCard" class="panel">
  <div class="meta">
    <span id="catLabel"></span>
    <span id="counter"></span>
  </div>
  <div class="progress"><div id="bar"></div></div>
  <div id="qtext" class="qtext"></div>
  <img id="qimage" class="qimage hidden" alt="問題画像">
  <div id="choices"></div>
  <div id="result" class="result"></div>
  <div id="note" class="note"></div>
  <div id="explanation" class="explanation"><div class="explanation-title">解説</div><div id="explanationText"></div></div>
  <label class="missline">
    <input type="checkbox" id="missCheck">
    この問題を「ミス」に登録
  </label>
</section>

<section class="panel small">
  <b>使い方</b><br>
  キーワード検索で問題文・選択肢・解説・年度・分野を絞り込めます。選択肢をタップして「答え合わせ」。判定後に、資料内の注記を使った解説が表示されます。複数選択問題にも対応しています。
  ミス登録は端末内に保存され、次回も「ミス問題のみ」で復習できます。
  一部、資料内に〇の正答表示がない問題は自動採点せず、その旨を表示します。
  <hr>
  <label class="toggle"><input type="checkbox" id="autoNext"> 正解したら自動で次へ</label>
  <button id="resetBtn" class="danger" style="margin-top:10px">学習履歴をリセット</button>
</section>
</div>

<div class="bottom">
  <div class="inner">
    <button id="prevBtn">← 前へ</button>
    <button id="checkBtn" class="primary">答え合わせ</button>
    <button id="nextBtn">次へ →</button>
  </div>
</div>

<script src="questions1231fix.js"></script>
<script>
const QUESTIONS = window.QUESTIONS;
const STORAGE_KEY = "radiology_quiz_state_answerfix_1231";

let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
if(!state.answers) state.answers={};
if(!state.miss) state.miss={};
if(!state.settings) state.settings={autoNext:false};

let order = QUESTIONS.map(q=>q.id);
let index = 0;
let checked = false;

const $ = id => document.getElementById(id);
const category=$("category"), mode=$("mode"), keyword=$("keyword");

function save(){
  state.settings.autoNext=$("autoNext").checked;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function categories(){
  return ["すべて", ...new Set(QUESTIONS.map(q=>q.category))];
}

function init(){
  category.innerHTML=categories().map(c=>`<option value="${c}">${c}</option>`).join("");
  $("autoNext").checked=!!state.settings.autoNext;
  $("autoNext").addEventListener("change",save);
  rebuild();
  render();
}

function normalizeSearchText(value){
  return String(value ?? "")
    .normalize("NFKC")
    .toLowerCase()
    .replace(/\s+/g," ")
    .trim();
}

function searchableText(q){
  return normalizeSearchText([
    q.category, q.year, q.number, q.question,
    ...(q.choices || []), q.note, q.explanation
  ].join(" "));
}

function filteredIds(){
  const c=category.value;
  const m=mode.value;
  const terms=normalizeSearchText(keyword.value).split(" ").filter(Boolean);
  return QUESTIONS.filter(q=>{
    if(c && c!=="すべて" && q.category!==c) return false;
    if(m==="wrong" && !state.miss[q.id]) return false;
    if(m==="unanswered" && state.answers[q.id]) return false;
    if(terms.length){
      const haystack=searchableText(q);
      if(!terms.every(term=>haystack.includes(term))) return false;
    }
    return true;
  }).map(q=>q.id);
}

function rebuild(shuffle=false){
  order=filteredIds();
  if(shuffle){
    for(let i=order.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [order[i],order[j]]=[order[j],order[i]];
    }
  }
  index=0; checked=false;
  updateStats();
}

function current(){
  return QUESTIONS.find(q=>q.id===order[index]);
}

function render(){
  updateStats();
  if(order.length===0){
    $("catLabel").textContent="";
    $("counter").textContent="0 / 0";
    $("bar").style.width="0%";
    $("qtext").textContent="この条件に該当する問題はありません。検索語を変えてください。";
    $("qimage").removeAttribute("src");
    $("qimage").classList.add("hidden");
    $("choices").innerHTML="";
    $("result").className="result";
    $("result").textContent="";
    $("note").textContent="";
    $("explanation").className="explanation";
    $("explanationText").textContent="";
    $("missCheck").checked=false;
    $("prevBtn").disabled=$("nextBtn").disabled=$("checkBtn").disabled=true;
    return;
  }
  const q=current();
  $("prevBtn").disabled=index===0;
  $("nextBtn").disabled=index===order.length-1;
  $("checkBtn").disabled=false;
  $("catLabel").textContent=q.category+"｜"+q.year+"-"+q.number;
  $("counter").textContent=(index+1)+" / "+order.length;
  $("bar").style.width=((index+1)/order.length*100)+"%";
  $("qtext").textContent=q.question;
  const qi=$("qimage");
  if(q.image){ qi.src=q.image; qi.classList.remove("hidden"); } else { qi.removeAttribute("src"); qi.classList.add("hidden"); }
  $("missCheck").checked=!!state.miss[q.id];
  $("result").className="result";
  $("result").textContent="";
  $("note").textContent="";
  $("explanation").className="explanation";
  $("explanationText").textContent="";
  checked=false;

  const saved=state.answers[q.id]?.selected || [];
  $("choices").innerHTML=q.choices.map((t,i)=>{
    const letter=String.fromCharCode(97+i);
    const type=q.answers.length>1 ? "checkbox":"radio";
    const isSel=saved.includes(letter);
    return `<label class="choice ${isSel?"selected":""}">
      <input type="${type}" name="choice" value="${letter}" ${isSel?"checked":""}>
      <span><b>${letter.toUpperCase()}.</b> ${t}</span>
    </label>`;
  }).join("");

  document.querySelectorAll(".choice input").forEach(inp=>{
    inp.addEventListener("change",()=>{
      document.querySelectorAll(".choice").forEach(l=>l.classList.toggle("selected",l.querySelector("input").checked));
      if(inp.type==="radio"){
        document.querySelectorAll(".choice").forEach(l=>l.classList.toggle("selected",l.querySelector("input").checked));
      }
    });
  });
}

function selected(){
  return [...document.querySelectorAll(".choice input:checked")].map(x=>x.value).sort();
}

function same(a,b){return a.length===b.length && a.every((v,i)=>v===b[i]);}

function checkAnswer(){
  const q=current();
  const sel=selected();
  if(sel.length===0){
    $("result").className="result warn";
    $("result").textContent="選択肢を選んでください。";
    return;
  }
  checked=true;
  const correct=[...q.answers].sort();
  state.answers[q.id]={selected:sel, correct:false, at:Date.now()};

  if(!q.hasAnswer){
    $("result").className="result warn";
    $("result").textContent="元資料に正答記載がないため、自動採点できません。";
    $("note").textContent=q.note || "";
    $("explanationText").textContent=q.explanation || "資料内に追加の解説記載はありません。";
    $("explanation").className="explanation show";
    save(); updateStats(); return;
  }

  const ok=same(sel,correct);
  state.answers[q.id].correct=ok;
  if(!ok) state.miss[q.id]=true;
  $("missCheck").checked=!!state.miss[q.id];

  document.querySelectorAll(".choice").forEach(l=>{
    const v=l.querySelector("input").value;
    if(correct.includes(v)) l.classList.add("correct");
    if(l.querySelector("input").checked && !correct.includes(v)) l.classList.add("wrong");
  });

  $("result").className="result "+(ok?"ok":"ng");
  $("result").textContent=ok ? "正解！" : "不正解　正答："+correct.map(x=>x.toUpperCase()).join("・");
  $("note").textContent=q.note || "";
  $("explanationText").textContent=q.explanation || "資料内に追加の解説記載はありません。";
  $("explanation").className="explanation show";
  save(); updateStats();

  if(ok && $("autoNext").checked && index<order.length-1){
    setTimeout(()=>{index++;render();},650);
  }
}

function updateStats(){
  $("totalStat").textContent=order.length;
  const ids=new Set(order);
  const correct=Object.entries(state.answers).filter(([id,a])=>ids.has(Number(id)) && a.correct).length;
  const misses=Object.keys(state.miss).filter(id=>ids.has(Number(id)) && state.miss[id]).length;
  $("correctStat").textContent=correct;
  $("missStat").textContent=misses;
}

$("missCheck").addEventListener("change",e=>{
  const q=current();
  if(!q) return;
  if(e.target.checked) state.miss[q.id]=true;
  else delete state.miss[q.id];
  save(); updateStats();
});
$("checkBtn").addEventListener("click",checkAnswer);
$("prevBtn").addEventListener("click",()=>{if(index>0){index--;render();}});
$("nextBtn").addEventListener("click",()=>{if(index<order.length-1){index++;render();}});
$("startBtn").addEventListener("click",()=>{rebuild(false);render();});
$("shuffleBtn").addEventListener("click",()=>{rebuild(true);render();});
category.addEventListener("change",()=>{rebuild(false);render();});
mode.addEventListener("change",()=>{rebuild(false);render();});
keyword.addEventListener("input",()=>{rebuild(false);render();});
$("clearSearchBtn").addEventListener("click",()=>{
  keyword.value="";
  keyword.focus();
  rebuild(false);
  render();
});
$("resetBtn").addEventListener("click",()=>{
  if(confirm("正答履歴とミス登録をすべて消しますか？")){
    state={answers:{},miss:{},settings:{autoNext:$("autoNext").checked}};
    save(); rebuild(); render();
  }
});
init();
</script>
</body>
</html>
